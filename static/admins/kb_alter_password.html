<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
    <style>
        :root {
            --primary: #4f8c6c; --primary-light: #e8f5e9;
            --bg: #f5f7fa; --card-bg: #fff; --text: #2c3e50; --text-secondary: #7f8c9b;
            --border: #e8ecf1; --error: #ff4d4f; --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #f0f4f1 30%, #f5f7fa 70%, #e3f2fd 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 420px; padding: 24px; }
        .header { text-align: center; margin-bottom: 24px; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #4f8c6c 0%, #66bb6a 100%); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(79,140,108,0.25); }
        .logo-icon svg { width: 28px; height: 28px; fill: white; }
        .header h1 { font-size: 22px; font-weight: 700; color: var(--text); }
        .card {
            background: var(--card-bg); border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 32px 28px; border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn-primary {
            width: 100%; padding: 12px 0; background: linear-gradient(135deg, #4f8c6c 0%, #43a047 100%);
            color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(79,140,108,0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .footer-link { text-align: center; margin-top: 18px; }
        .footer-link a { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
        .alert { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; font-size: 13px; text-align: center; animation: fadeIn 0.3s ease; }
        .alert-error { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
        .alert-success { background: #f0fff0; color: #389e0d; border: 1px solid #b7eb8f; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM8 13h8v2H8v-2zm0 4h8v2H8v-2zm0-8h3v2H8V9z"/></svg>
        </div>
        <h1>修改密码</h1>
    </div>
    <div class="card">
        <div id="alertBox"></div>
        <div class="form-group">
            <label>管理员用户名</label>
            <input type="text" id="username" placeholder="请输入要重置密码的管理员用户名">
        </div>
        <div class="form-group">
            <label>新密码</label>
            <input type="password" id="newPassword" placeholder="至少 6 位">
        </div>
        <div class="form-group">
            <label>确认新密码</label>
            <input type="password" id="confirmPassword" placeholder="再次输入新密码">
        </div>
        <button class="btn-primary" id="btn" onclick="handleAlter()">
            <span id="btnText">修改密码</span>
        </button>
        <div class="footer-link">
            <a href="/kb_login.html">返回登录</a>
        </div>
    </div>
</div>
<script>
async function handleAlter() {
    const username = document.getElementById('username').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const confirmPassword = document.getElementById('confirmPassword').value.trim();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('btn');
    const btnText = document.getElementById('btnText');

    alertBox.className = '';
    alertBox.textContent = '';

    if (!username || !newPassword || !confirmPassword) {
        alertBox.className = 'alert alert-error'; alertBox.textContent = '请填写所有字段'; return;
    }
    if (newPassword !== confirmPassword) {
        alertBox.className = 'alert alert-error'; alertBox.textContent = '两次新密码输入不一致'; return;
    }
    if (newPassword.length < 6) {
        alertBox.className = 'alert alert-error'; alertBox.textContent = '新密码长度不能少于 6 位'; return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> 提交中...';

    try {
        const res = await fetch('/api/kb/alter-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, new_password: newPassword, confirm_password: confirmPassword }),
        });
        const data = await res.json();
        if (data.success) {
            alertBox.className = 'alert alert-success';
            alertBox.textContent = '密码修改成功，即将跳转登录页...';
            btn.style.display = 'none';
            setTimeout(() => { window.location.href = '/kb_login.html?msg=' + encodeURIComponent('密码修改成功，请重新登录'); }, 1500);
        } else {
            alertBox.className = 'alert alert-error'; alertBox.textContent = data.message || '修改失败';
        }
    } catch (err) {
        alertBox.className = 'alert alert-error'; alertBox.textContent = '网络错误，请重试';
    }

    btn.disabled = false;
    btnText.textContent = '修改密码';
}
</script>
</body>
</html>
