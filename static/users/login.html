<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 电商运营智能助手</title>
    <style>
        :root {
            --primary: #4f8c6c; --primary-dark: #3d6b52; --primary-light: #e8f5e9;
            --bg: #f5f7fa; --card-bg: #fff; --text: #2c3e50; --text-secondary: #7f8c9b;
            --border: #e8ecf1; --error: #ff4d4f; --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #f0f4f1 30%, #f5f7fa 70%, #e3f2fd 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 400px; padding: 24px; }
        .header { text-align: center; margin-bottom: 32px; }
        .logo-icon { width: 72px; height: 72px; margin: 0 auto 18px; }
        .logo-icon svg { width: 100%; height: 100%; }
        .header h1 { font-size: 24px; font-weight: 700; color: var(--text); }
        .header p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
        .card {
            background: var(--card-bg); border-radius: 16px; box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 36px 32px; border: 1px solid var(--border);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--primary); }
        .btn-primary {
            width: 100%; padding: 12px 0; background: linear-gradient(135deg, #4f8c6c 0%, #43a047 100%);
            color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(79,140,108,0.3);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,140,108,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .links { display: flex; justify-content: space-between; margin-top: 24px; }
        .links a { font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
        .alert { margin-top: 16px; padding: 10px 14px; border-radius: 8px; font-size: 13px; text-align: center; }
        .alert-error { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
        .alert-success { background: #f0fff0; color: #389e0d; border: 1px solid #b7eb8f; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-icon">
            <svg viewBox="0 0 64 64" fill="none">
                <rect x="4" y="12" width="56" height="40" rx="6" fill="#4f8c6c" opacity="0.15"/>
                <rect x="8" y="16" width="48" height="32" rx="4" fill="url(#grad)"/>
                <path d="M20 30 L28 22 L36 28 L44 20" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="20" cy="30" r="3" fill="#fff"/>
                <circle cx="28" cy="22" r="3" fill="#fff"/>
                <circle cx="36" cy="28" r="3" fill="#fff"/>
                <circle cx="44" cy="20" r="3" fill="#fff"/>
                <path d="M18 40 L28 33 L36 38 L46 30" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
                <defs>
                    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#4f8c6c"/>
                        <stop offset="100%" stop-color="#66bb6a"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <h1>电商运营智能助手</h1>
        <p>开启你的电商运营之旅</p>
    </div>
    <div class="card">
        <div style="margin-bottom:20px;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
                <span id="btnText">登 录</span>
            </button>
        </div>
        <div id="alertBox"></div>
        <div class="links">
            <a href="/register.html">注册账号</a>
            <a href="/alter_password.html">忘记密码？</a>
        </div>
    </div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const msg = urlParams.get('msg');
if (msg) {
    const box = document.getElementById('alertBox');
    box.className = 'alert alert-success';
    box.textContent = decodeURIComponent(msg);
}

async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');

    if (!username || !password) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = '请填写用户名和密码';
        return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> 登录中...';

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem('qa_auth', '1');
            window.location.href = '/';
        } else {
            alertBox.className = 'alert alert-error';
            alertBox.textContent = data.message || '登录失败';
        }
    } catch (err) {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = '网络错误，请重试';
    }

    btn.disabled = false;
    btnText.textContent = '登 录';
}
</script>
</body>
</html>
